<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Loopyard guide</title>
  <style>
    /* Same palette as connect.html — docked on the right of the web UI. */
    :root {
      --ink: #0e0d0c; --panel: #17150f; --edge: #2a271e; --text: #efe9df;
      --muted: #9c9484; --phos: #8ff0a4; --amber: #f0c96b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--panel); color: var(--text); border-left: 1px solid var(--edge);
      font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; -webkit-user-select: none;
    }
    header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--edge); }
    header h1 { font-size: 14.5px; margin: 0; flex: 1; }
    header .x { background: transparent; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 6px; }
    main { flex: 1; overflow-y: auto; padding: 14px 16px; }
    #welcome { margin: 0 0 14px; color: var(--text); }
    h2 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; display: flex; gap: 8px; }
    h2 .n { font-weight: 400; }
    ol, ul { list-style: none; margin: 0; padding: 0; }
    li { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; align-items: start;
      padding: 8px 0; border-top: 1px solid var(--edge); }
    li:first-child { border-top: 0; }
    .tick { color: var(--muted); } li.done .tick { color: var(--phos); }
    .t { font-weight: 600; } .w { grid-column: 2 / 4; color: var(--muted); font-size: 12px; }
    button.go { background: transparent; border: 1px solid var(--edge); color: var(--phos); border-radius: 8px;
      font-size: 12px; padding: 3px 10px; cursor: pointer; }
    #note { color: var(--amber); font-size: 12px; margin: 0 0 10px; }
    #persona { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
    #untracked { color: var(--muted); font-size: 11.5px; margin: 4px 0 0; }
    details { margin-top: 18px; border-top: 1px solid var(--edge); padding-top: 10px; }
    summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    #prompt { white-space: pre-wrap; font: 11.5px/1.45 ui-monospace, Menlo, monospace; color: var(--text);
      background: var(--ink); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 10px; margin: 8px 0;
      -webkit-user-select: text; user-select: text; max-height: 260px; overflow-y: auto; }
    #copy { background: transparent; border: 1px solid var(--edge); color: var(--phos); border-radius: 8px;
      font-size: 12px; padding: 3px 10px; cursor: pointer; }
    footer { padding: 10px 16px 14px; border-top: 1px solid var(--edge); display: flex; gap: 8px; }
    footer button { flex: 1; background: transparent; border: 1px solid var(--edge); color: var(--muted);
      border-radius: 9px; padding: 7px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Loopyard guide</h1>
    <button class="x" id="hide" title="Hide the guide (Help ▸ Onboarding guide brings it back)">✕</button>
  </header>
  <main>
    <p id="note" hidden></p>
    <p id="persona" hidden></p>
    <p id="welcome"></p>
    <h2>Getting started <span class="n" id="count"></span></h2>
    <ol id="steps"></ol>
    <p id="untracked" hidden>This Loopyard engine does not report progress yet, so steps are not ticked for you.</p>
    <section id="more" hidden>
      <h2>When you're ready</h2>
      <ul id="explore"></ul>
    </section>
    <h2>Where things are</h2>
    <ul id="places"></ul>
    <details id="script" hidden>
      <summary>What the guide will do in a Claude session</summary>
      <pre id="prompt"></pre>
      <button id="copy" title="Copy the guide's prompt to run it in your own Claude session">Copy</button>
    </details>
  </main>
  <footer>
    <button id="dismiss" title="Keep it closed next time — Help ▸ Onboarding guide still opens it">Don't show on start</button>
  </footer>
  <script>
    // The page only ever sends a step/place KEY; main maps it to a web-UI route.
    const api = window.loopyardGuide;
    const $ = (id) => document.getElementById(id);

    function row(item, isStep) {
      const li = document.createElement('li');
      li.dataset.key = item.key;
      if (item.done) li.classList.add('done');
      const tick = document.createElement('span');
      tick.className = 'tick';
      tick.textContent = isStep ? (item.done ? '✓' : '○') : '›';
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = isStep ? item.title : item.label;
      li.append(tick, t);
      if (item.route) {
        const b = document.createElement('button');
        b.className = 'go';
        b.textContent = isStep ? (item.action || 'Go') : 'Open';
        b.addEventListener('click', () => api.go(item.key).then((r) => { if (r && r.view) render(r.view); }));
        li.append(b);
      } else {
        li.append(document.createElement('span'));
      }
      if (item.what) {
        const w = document.createElement('span');
        w.className = 'w';
        w.textContent = item.what;
        li.append(w);
      }
      return li;
    }

    function render(v) {
      if (!v) return;
      $('title').textContent = (v.agent && v.agent.name) || 'Loopyard guide';
      $('welcome').textContent = v.welcome || '';
      const persona = (v.agent && v.agent.persona) || '';
      $('persona').hidden = !persona;
      $('persona').textContent = persona;
      $('untracked').hidden = v.tracked !== false || v.source === 'fallback';
      $('script').hidden = !v.prompt;
      $('prompt').textContent = v.prompt || '';
      const note = $('note');
      note.hidden = v.source !== 'fallback';
      note.textContent = v.source === 'fallback'
        ? 'This Loopyard engine is older than the app, so the guide shows a short version. Update the engine for the full walkthrough.'
        : '';
      $('steps').replaceChildren(...(v.steps || []).map((s) => row(s, true)));
      const p = v.progress || {};
      $('count').textContent = v.tracked && p.total ? `${p.done} of ${p.total}` : '';
      // optional next steps unlock once the core steps are done
      const more = (p.complete && v.explore) || [];
      $('more').hidden = !more.length;
      $('explore').replaceChildren(...more.map((s) => row(s, true)));
      $('places').replaceChildren(...(v.places || []).map((p) => row(p, false)));
    }

    $('copy').addEventListener('click', () => {
      const text = $('prompt').textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => { $('copy').textContent = 'Copied'; }, () => {});
    });
    $('hide').addEventListener('click', () => api.hide());
    $('dismiss').addEventListener('click', () => api.dismiss());
    api.onView(render);
    api.get().then(render);
  </script>
</body>
</html>

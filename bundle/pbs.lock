# Pinned python-build-standalone runtime for the Loopyard origin bundle
# (PHASE-B-SPEC §1.6 step 1). The builder refuses a tarball whose sha256 differs.
# Hashes are the GitHub release asset digests, re-verified by download.
release = "20260924"
python = "3.13.15"
flavor = "install_only_stripped"
url_base = "https://github.com/astral-sh/python-build-standalone/releases/download"
# Build-host-only tool (never shipped). The builder warns if the host uv differs.
uv = "0.11.21"
# compileall -x regex for intentionally unparseable fixtures in this release.
# Empty: release 20260924 compiles clean.
compileall_exclude = ""

[targets.linux-x86_64]
triple = "x86_64-unknown-linux-gnu"
sha256 = "d0b640eed27fbdd6f5f2bd33444aee53df2c8863f8b2a96f4094717411e3de9c"

[targets.linux-aarch64]
triple = "aarch64-unknown-linux-gnu"
sha256 = "5ad58156cbec94e5643c13caa792e92df72a23f33d3a6425d4cbff5c4b7a040c"

[targets.macos-arm64]
triple = "aarch64-apple-darwin"
sha256 = "064afb7c2fc0bbf511d886288adf98696af5105e36c138cdf2c199c0146fcf68"

[targets.macos-x86_64]
triple = "x86_64-apple-darwin"
sha256 = "327814efd865a0b6a99c149b12a261e9d0ad409183515c745d41bda2d07282e9"
